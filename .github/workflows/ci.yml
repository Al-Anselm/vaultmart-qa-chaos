name: VaultMart Automated QA & CI/CD Gate

on:
  push:
    branches: [ "main", "solution-green-build" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # JOB 1: Baseline Smoke & DOM Security Gate (Passes on Starter Repo)
  # ============================================================================
  baseline-smoke-gate:
    name: "Station 3A: Baseline Smoke & DOM Gate"
    runs-on: ubuntu-latest

    steps:
      - name: "Station 1: Checkout Source Code (git commit)"
        uses: actions/checkout@v4

      - name: "Station 2: Setup Python 3.12 & Dependencies (CI Build)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Requirements & Headless Chromium"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: "Station 3: Run Headless Playwright Smoke Tests (QA Gate)"
        run: |
          pytest -v -k "test_1 or test_2"

      - name: "Station 4: Upload Automated Evidence Screenshots (CD Artifact)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots
          path: screenshot_*.png

  # ============================================================================
  # JOB 2: Full Chaos & AI Red-Team Gate (Fails on Starter Repo until solved!)
  # ============================================================================
  full-chaos-redteam-gate:
    name: "Station 3B: Full Chaos & AI Red-Team Gate"
    runs-on: ubuntu-latest

    steps:
      - name: "Station 1: Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Station 2: Setup Python 3.12 & Playwright"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Requirements & Headless Chromium"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: "Station 3: Execute All 5 Playwright Chaos & Red-Team Tests"
        run: |
          pytest -v

      - name: "Station 4: Publish All 5 Exploit Screenshots"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-exploit-screenshots
          path: screenshot_*.png
